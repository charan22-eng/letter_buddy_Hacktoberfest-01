[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "letter-buddy"
version = "0.1.0"
description = "Offline letter reader and explainer for people who find official mail hard to understand"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Letter Buddy Contributors"}
]

dependencies = [
    # Image preprocessing
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "PyMuPDF>=1.23",          # PDF → images (fitz)

    # OCR
    "pytesseract>=0.3.10",

    # Field extraction
    "regex>=2023.0",
    "python-dateutil>=2.8",
    "phonenumbers>=8.13",
    "babel>=2.12",

    # LLM
    "httpx>=0.25",            # Ollama HTTP client

    # Validation
    "pydantic>=2.4",

    # TTS
    # eSpeak-ng (system install) – no pip package needed for core
    # piper-tts – optional, installed if voice available

    # Web
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",

    # Fuzzy matching
    "rapidfuzz>=3.4",

    # System metrics
    "psutil>=5.9",
    "pynvml>=11.5",

    # Config
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.7",
]
eval = [
    "jiwer>=3.0",             # OCR word/char error rate
]

[project.scripts]
letterbuddy = "letterbuddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
