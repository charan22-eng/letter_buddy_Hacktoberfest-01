# ── Status messages ──────────────────────────────────
status:
  reading: "మీ ఉత్తరం చదువుతున్నాను…"
  understanding: "ఉత్తరం అర్థం చేసుకుంటున్నాను…"
  translating: "మీకోసం అనువదిస్తున్నాను…"
  speaking: "బిగ్గరగా చదువుతున్నాను…"
  done: "అయిపోయింది!"
  error: "ఏదో తప్పు జరిగింది. దయచేసి మళ్ళీ ప్రయత్నించండి."

# ── Quality gate ─────────────────────────────────────
quality:
  retake: "నాకు ఈ ఫోటో బాగా చదవలేకపోతున్నాను. దయచేసి మంచి వెలుతురులో మళ్ళీ ఫోటో తీయండి."
  blurry: "ఫోటో అస్పష్టంగా ఉంది. కెమెరాను స్థిరంగా పట్టుకుని మళ్ళీ ప్రయత్నించండి."
  dark: "ఫోటో చాలా చీకటిగా ఉంది. ప్రకాశవంతమైన చోటికి వెళ్ళండి."
  tilted: "ఉత్తరం చాలా వంగి ఉంది. కెమెరాను ఉత్తరం పైన నేరుగా పట్టుకోండి."
  cut_off: "ఉత్తరంలో కొంత భాగం కనిపించడం లేదు. మొత్తం ఉత్తరం ఫోటోలో ఉందని చూడండి."

# ── Safety banners ───────────────────────────────────
safety:
  disclaimer: "నేను ఉత్తరంలో ఏమి రాసి ఉందో చెబుతాను. నేను చట్ట, వైద్య లేదా ఆర్థిక సలహా ఇవ్వలేను."
  scam_warning: "⚠️ హెచ్చరిక: బ్యాంకులు మరియు ప్రభుత్వ కార్యాలయాలు ఎప్పుడూ మీ OTP, PIN లేదా పాస్‌వర్డ్ అడగవు. ఎవరికీ చెప్పకండి. మీ బ్యాంక్ కార్డ్ లేదా పాస్‌బుక్ మీద ఉన్న నంబర్‌కు కాల్ చేయండి."
  needs_person: "⚠️ ఇది ముఖ్యమైనది. దయచేసి ఏదైనా చేయడానికి ముందు ఈ ఉత్తరాన్ని {trusted_contact} కి చూపించండి."
  check_number: "⚡ దయచేసి ఈ నంబర్‌ను కాగితంపై చూసి ధ్రువీకరించండి — నేను సరిగ్గా చదివానో నాకు ఖచ్చితంగా తెలియదు."
  auto_translation: "ఈ అనువాదం ఆటోమేటిక్‌గా జరిగింది. సందేహం ఉంటే కుటుంబ సభ్యుడిని అడగండి."
  prescription_warning: "⚠️ ఇది ప్రిస్క్రిప్షన్. ఉత్తరంలో ఏమి రాసి ఉందో అదే చూపిస్తున్నాను. మందులు లేదా మోతాదుల గురించి ఏవైనా ప్రశ్నలు ఉంటే {trusted_contact} కి చూపించండి."

